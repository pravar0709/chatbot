services:
  - type: web
    name: lyftr-chatbot-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DEFAULT_SYSTEM_PROMPT
        value: You are a helpful assistant.
      - key: LLM_TIMEOUT
        value: "30"
      - key: PORT
        value: "8000"
      - key: LITELLM_LOCAL_MODEL_COST_MAP
        value: "True"
    healthCheckPath: /health
